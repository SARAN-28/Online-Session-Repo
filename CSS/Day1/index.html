<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS</title>
    <link rel="stylesheet" href="./style.css">

    <!-- Internal CSS -->
    <!-- 
    <style>
        h1 {
            color: blue;
            background-color: blueviolet;
        }
    </style> -->
</head>

<body>

    <!-- CSS - Cascading Style Sheet -->
    <!-- Used to style the HTML elements -->

    <!-- Three Types of CSS -->
    <!-- 
    1.Inline CSS
    2.Internal CSS
    3.External CSS -->

    <!-- Syntax -->
    <!--      
    selectors{
    property: value
    } -->
    <!-- eg:
    h1{
       color: green
    } -->


    <!-- Inline CSS -->
    <h1 style="color: red; background-color: aqua; font-size: 100px;">This is Inline CSS</h1>

    <!-- Internal CSS -->
    <h1>This is Internal CSS</h1>

    <!-- External CSS -->
    <h1>This is External CSS</h1>

    <!-- Colors -->
    <h1>This is Color property and its value</h1>

    <!-- Selectors -->

    <!-- Universal Selector -->
    <p>This is Universal Selector</p>

    <!-- ID - Selector -->
    <div id="head">
        <h1>This is ID Selector</h1>
        <p>Hello</p>
    </div>

    <!-- Class - Selector -->
    <div class="container">
        <h1>This is Class Selector</h1>
        <p>Hello</p>
    </div>

    <!-- 
     <div id="container">
        <div class="head">
            <p>Hello</p>
        </div>
        <div class="head">
            <p>Hello</p>
        </div>
    </div> -->

    <!-- Element Selector -->
    <h1>This is Element Selector</h1>

    <!-- Grouping Selector -->
    <h1>Hello</h1>
    <p>Hi</p>
    <span>Good Morning</span>
    <h6>Good Evening</h6>

    <!-- Descendent Selector -->
    <div class="desc">
        <p>Good Morning</p>

        <div>
            <h1>Hello</h1>
            <p>Good Evening</p>
        </div>
    </div>


</body>

</html>
