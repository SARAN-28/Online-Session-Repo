<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Day 5</title>
    <link rel="stylesheet" href="./style.css">
</head>

<body>

    <!-- Grid Layouts -->
    <div class="container">
        <div class="header">Header</div>
        <div class="sidebar">Sidebar</div>
        <div class="main">Main</div>
        <div class="footer">Footer</div>
    </div>


    <!-- OverFlow -->
    <p>Lorem200</p>


    <!-- Pseudo Classes -->
    <!-- Hover -->
    <button>Submit</button>


    <!-- Active -->
    <button>Submit</button>


    <!-- Focus -->
    <input type="text" placeholder="Enter your Name">


    <!-- First, last, nth Child -->
    <div>
        <p>Hello</p>
        <p>Hello</p>
        <p>Hello</p>
        <p>Hello</p>
        <p>Hello</p>
    </div>


    <!-- Checked -->
    <input type="checkbox" checked>


    <!-- Not Selected -->
    <p>HTML</p>
    <p class="skip">CSS</p>
    <p>Java Script</p>


    <!-- Disabled -->
    <input type="text" disabled value="Not Editable">


    <!-- Enabled -->
    <input type="text" enabled value="Editable...">


    <!-- First, Last, nth type -->
    <p>Hello</p>
    <p>Hello</p>
    <p>Hello</p>
    <p>Hello</p>
    <p>Hello</p>

</body>

</html>
