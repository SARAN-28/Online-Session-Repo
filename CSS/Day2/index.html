<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Day2</title>
    <link rel="stylesheet" href="./style.css">
    <link rel="icon" href="./icons8-css-logo-48.png">
</head>

<body>

    <!-- Child Selector -->
    <div class="child">
        <h1>This is Child Selector</h1>

        <div>
            <h1>Nested Div</h1>
            <p>Hello</p>
        </div>
    </div>

    <!-- Adjacent Siblings Selector -->
    <div class="adj">
        <h1>Adjacent Siblings Selector</h1>
        <p>Hello1</p>
        <p>Hello2</p>
        <p>Hello3</p>
        <p>Hello4</p>
        <p>Hello5</p>
    </div>

    <!-- General Siblings Selector -->
    <div class="general">
        <h1>General Siblings Selector</h1>
        <p>Hello1</p>
        <p>Hello2</p>
        <p>Hello3</p>
        <p>Hello4</p>
        <p>Hello5</p>
    </div>

    <!-- Attribute selector -->
    <input type="text">
    <input type="password">

    <!-- Border -->
    <button>Submit</button>

    <!-- Background Image -->
    <h1>Background Image</h1>
    <p>Lorem1000</p>

    <!-- Margin, Padding, Height & Width  -->
    <button>Submit</button>

    <!-- Height & Width -->
    <div></div>
</body>

</html>
